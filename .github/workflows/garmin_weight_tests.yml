name: garmin weight tests

# 데이터 커밋(garmin-weight/data/**)은 하루 2회 봇이 만들므로 트리거에서 뺀다.
on:
  push:
    paths:
      - 'garmin-weight/scripts/**'
      - 'garmin-weight/config.json'
      - 'garmin-weight/*.js'
      - 'garmin-weight/*.html'
      - 'garmin-weight/*.css'
      - 'garmin-weight/manifest.webmanifest'
      - 'garmin-weight/icons/**'
      - 'tests/test_garmin*'
      - 'tests/garmin_weight*.mjs'
      - 'requirements.txt'
      # 수집·probe 워크플로의 셸 스텝도 테스트가 본다(tests/test_garmin_workflows.py).
      - '.github/workflows/garmin_weight_*.yml'
  pull_request:
    paths:
      - 'garmin-weight/scripts/**'
      - 'garmin-weight/config.json'
      - 'garmin-weight/*.js'
      - 'garmin-weight/*.html'
      - 'garmin-weight/*.css'
      - 'garmin-weight/manifest.webmanifest'
      - 'garmin-weight/icons/**'
      - 'tests/test_garmin*'
      - 'tests/garmin_weight*.mjs'
      - 'requirements.txt'
      - '.github/workflows/garmin_weight_*.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # 요약 생성과 테스트는 표준 라이브러리만 쓴다(garminconnect는 수집 단계에서만 지연 임포트).
      - name: Unit tests
        env:
          PYTHONUTF8: '1'
        run: python -m unittest discover -s tests -p 'test_garmin*.py' -v
      - name: Rebuild summary from committed CSV (smoke)
        run: |
          python garmin-weight/scripts/sync_garmin.py --skip-garmin --output-summary "$RUNNER_TEMP/summary.json"
          python -c "import json,sys; s=json.load(open(sys.argv[1], encoding='utf-8')); assert s['series']['daily'], 'empty daily series'" "$RUNNER_TEMP/summary.json"
      - name: Front-end syntax check
        run: |
          for f in garmin-weight/app.js garmin-weight/app.helpers.js garmin-weight/enhancements.js garmin-weight/sw.js; do
            node --check "$f"
          done
      # 서비스 워커 캐시 동작(쿼리를 뗀 데이터 캐시 키, CDN 응답 저장)을 Cache API 흉내로 확인한다.
      - name: Service worker tests
        run: node --test tests/garmin_weight_sw.test.mjs

  # 수집 코드가 부르는 메서드가 고정한 garminconnect 버전에 모두 있는지 본다. 로그인은 하지 않는다.
  library:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Garmin client has every method the sync calls
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'garmin-weight/scripts')
          import sync_garmin
          from garminconnect import Garmin
          missing = [m for m in sync_garmin.GARMIN_METHODS if not callable(getattr(Garmin, m, None))]
          assert not missing, f'missing on Garmin: {missing}'
          print('garminconnect methods ok:', len(sync_garmin.GARMIN_METHODS))
          "

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Page display regressions
        env:
          PYTHONUTF8: '1'
          GARMIN_REQUIRE_BROWSER_TESTS: '1'
        run: python -m unittest tests.test_garmin_weight_browser -v
