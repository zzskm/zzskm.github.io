name: garmin weight tests

# 데이터 커밋(garmin-weight/data/**)은 하루 2회 봇이 만들므로 트리거에서 뺀다.
on:
  push:
    paths:
      - 'garmin-weight/scripts/**'
      - 'garmin-weight/config.json'
      - 'garmin-weight/*.js'
      - 'garmin-weight/*.html'
      - 'garmin-weight/*.css'
      - 'garmin-weight/manifest.webmanifest'
      - 'garmin-weight/icons/**'
      - 'tests/test_garmin*'
      - 'tests/garmin_weight*'
      - 'requirements.txt'
      # 수집·probe 워크플로의 셸 스텝도 테스트가 본다(tests/test_garmin_workflows.py).
      - '.github/workflows/garmin_weight_*.yml'
  pull_request:
    paths:
      - 'garmin-weight/scripts/**'
      - 'garmin-weight/config.json'
      - 'garmin-weight/*.js'
      - 'garmin-weight/*.html'
      - 'garmin-weight/*.css'
      - 'garmin-weight/manifest.webmanifest'
      - 'garmin-weight/icons/**'
      - 'tests/test_garmin*'
      - 'tests/garmin_weight*'
      - 'requirements.txt'
      - '.github/workflows/garmin_weight_*.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # 요약 생성과 테스트는 표준 라이브러리만 쓴다(garminconnect는 수집 단계에서만 지연 임포트).
      - name: Unit tests
        env:
          PYTHONUTF8: '1'
        run: bash tests/garmin_weight_ci.sh discover -s tests -p 'test_garmin*.py'
      - name: Rebuild summary from committed CSV (smoke)
        run: |
          python garmin-weight/scripts/sync_garmin.py --skip-garmin --output-summary "$RUNNER_TEMP/summary.json"
          python -c "import json,sys; s=json.load(open(sys.argv[1], encoding='utf-8')); assert s['series']['daily'], 'empty daily series'" "$RUNNER_TEMP/summary.json"
      - name: Front-end syntax check
        run: |
          for f in garmin-weight/app.js garmin-weight/app.helpers.js garmin-weight/enhancements.js garmin-weight/sw.js; do
            node --check "$f"
          done
      # 서비스 워커의 설치·활성화·요청 처리를 Cache API 흉내로 확인한다. 실제 브라우저 확인은 browser 잡에 있다.
      - name: Service worker and page helper tests
        run: node --test tests/garmin_weight_sw.test.mjs tests/garmin_weight_helpers.test.mjs

  # 고정한 garminconnect 버전으로 수집 코드의 가정을 확인한다. 로그인도 네트워크 호출도 하지 않는다(전송 계층을 가짜로 바꾼다).
  # - 수집이 부르는 메서드와 토큰 갱신 함수가 있다.
  # - 호출이 실패해도 표시 이름이 든 경로가 로그에 나가지 않는다.
  # - 토큰 로그인 실패가 거부(401·403)인지 일시 오류인지 구분된다.
  library:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Sync code against the real garminconnect
        env:
          PYTHONUTF8: '1'
          # 라이브러리가 없으면 건너뛰지 않고 실패하게 한다.
          GARMIN_REQUIRE_LIBRARY_TESTS: '1'
        run: bash tests/garmin_weight_ci.sh tests.test_garmin_library

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Page display regressions
        env:
          PYTHONUTF8: '1'
          GARMIN_REQUIRE_BROWSER_TESTS: '1'
        run: bash tests/garmin_weight_ci.sh tests.test_garmin_weight_browser
      # 프로필을 유지한 채 브라우저를 여러 번 다시 띄워 설치·배포·오프라인을 본다.
      - name: Service worker life cycle
        env:
          PYTHONUTF8: '1'
          GARMIN_REQUIRE_BROWSER_TESTS: '1'
        run: bash tests/garmin_weight_ci.sh tests.test_garmin_weight_sw_browser
