name: Retirement simulator
on:
  pull_request:
    paths: ['retirement-simulator/**', 'retirement_simulator.html', 'tests/test_retirement_simulator_static.py', '.github/workflows/retirement-simulator.yml']
  push:
    branches: [main]
    paths: ['retirement-simulator/**', 'retirement_simulator.html', '.github/workflows/retirement-simulator.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: retirement-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
        working-directory: retirement-simulator
      - run: npm test && npm run build
        working-directory: retirement-simulator
      - run: npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: retirement-simulator
      - name: Keep other static apps in the Pages artifact
        run: |
          mkdir _site
          rsync -a --exclude='.git' --exclude='_site' --exclude='node_modules' --exclude='retirement-simulator' --exclude='tests' ./ _site/
          mkdir _site/retirement-simulator
          cp -r retirement-simulator/dist/. _site/retirement-simulator/
      - uses: actions/upload-artifact@v4
        with:
          name: pages-preview
          path: _site
      - uses: actions/upload-artifact@v4
        with:
          name: retirement-build
          path: retirement-simulator/dist
  publish:
    name: Publish compiled app to branch-based Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    permissions:
      contents: write
      pages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: retirement-build
          path: retirement-simulator/dist
      - name: Publish only the compiled entry and generated assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Data sync workflows may advance main while this build runs.
          source_paths=(retirement-simulator/app retirement-simulator/src retirement-simulator/scripts retirement-simulator/tests retirement-simulator/package.json retirement-simulator/package-lock.json retirement-simulator/vite.config.js retirement-simulator/tailwind.config.js retirement-simulator/postcss.config.js .github/workflows/retirement-simulator.yml)
          git diff --quiet "$GITHUB_SHA" HEAD -- "${source_paths[@]}" || { echo "App sources advanced; a newer run must publish them."; exit 1; }
          node retirement-simulator/scripts/publish-build.js
          git add retirement-simulator/index.html retirement-simulator/assets
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'build(retirement): publish compiled Pages assets'
            for attempt in 1 2 3; do
              git fetch origin main
              git diff --quiet "$GITHUB_SHA" origin/main -- "${source_paths[@]}" || { echo "App sources advanced; refusing stale output."; exit 1; }
              git rebase origin/main
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" = 3 ]; then exit 1; fi
            done
          fi
          # GITHUB_TOKEN commits do not start a Pages build automatically.
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
