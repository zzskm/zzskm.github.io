name: Retirement simulator
on:
  pull_request:
    paths: ['retirement-simulator/**', 'retirement_simulator.html', 'tests/test_retirement_simulator_static.py', '.github/workflows/retirement-simulator.yml']
  push:
    branches: [main]
    paths: ['retirement-simulator/**', 'retirement_simulator.html', '.github/workflows/retirement-simulator.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: retirement-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
        working-directory: retirement-simulator
      - run: npm test && npm run build
        working-directory: retirement-simulator
      - run: npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: retirement-simulator
      - name: Keep other static apps in the Pages artifact
        run: |
          mkdir _site
          rsync -a --exclude='.git' --exclude='_site' --exclude='node_modules' --exclude='retirement-simulator' --exclude='tests' ./ _site/
          mkdir _site/retirement-simulator
          cp -r retirement-simulator/dist/. _site/retirement-simulator/
      - uses: actions/upload-artifact@v4
        with:
          name: pages-preview
          path: _site
  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pages-preview
          path: _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
