name: garmin weight probe

# Garmin 호출을 바꿨을 때 main에 합치기 전에 러너에서 실제로 로그인해 받아 본다.
# --dry-run이라 CSV와 요약은 쓰지 않는다. 결과에는 값이 없다: 호출 결과 건수, 예외 클래스와 HTTP 상태,
# 필드별 채움 건수, 응답 구조(키·타입·리스트 길이, 식별자 키는 <id>), 월별 활동 수만 남는다.
# 결과는 실행 화면 주석과, garmin-probe/** 브랜치에서는 그 브랜치의 probe-results/에 커밋된다. 확인 후 브랜치를 지운다.
on:
  push:
    branches: ['garmin-probe/**']
  workflow_dispatch:
    inputs:
      days:
        description: Days to probe, ending today (KST)
        required: false
        default: "3"
      activities_since:
        description: Count activities per month from this date (one range query)
        required: false
        default: "2026-03-01"

permissions:
  contents: write

# 본 수집 워크플로(garmin weight sync)와 다른 그룹이다. 같은 브랜치의 probe끼리만 줄을 선다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 1

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Check Brotli runtime
        run: python scripts/check-brotli-runtime.py --require-curl

      # 토큰 시크릿은 넘기지 않는다(P4 전까지 비밀번호 로그인만 확인한다).
      - name: Probe Garmin endpoints (dry run)
        run: >-
          python garmin-weight/scripts/sync_garmin.py --dry-run
          --backfill-days "$PROBE_DAYS" --date "$(TZ=Asia/Seoul date +%Y-%m-%d)"
          --stats-output "$RUNNER_TEMP/garmin-probe.json"
          --probe-activities-since "$ACTIVITIES_SINCE"
        env:
          PROBE_DAYS: ${{ inputs.days || '3' }}
          # 월별 활동 수만 센다(D1: 2026-05-15 이후 activity_count가 0인 원인 판정). CSV에도 공개된 수준의 정보다.
          ACTIVITIES_SINCE: ${{ inputs.activities_since || '2026-03-01' }}
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}

      - name: Commit results to the probe branch
        if: always() && startsWith(github.ref, 'refs/heads/garmin-probe/')
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/garmin-probe.json"
          if [ ! -f "$report" ]; then
            echo "No probe report (login failed before collection)."
            exit 0
          fi
          name="probe-results/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            mkdir -p probe-results
            cp "$report" "$name"
            git add "$name"
            git commit -q -m "chore: garmin probe results ${GITHUB_RUN_ID}"
            if git push -q origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Saved $name"
              exit 0
            fi
            sleep $((attempt * 3))
            git fetch -q --depth=1 origin "${GITHUB_REF_NAME}"
            git reset -q --hard FETCH_HEAD
          done
          echo "::error::Could not push probe results"
          exit 1
