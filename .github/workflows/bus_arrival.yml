name: bus arrival scrape

on:
  workflow_dispatch:
    inputs:
      window:
        description: "수집 시간대 (KST, HH:MM-HH:MM)"
        default: "16:00-22:00"
      session_minutes:
        description: "세션 최대 길이(분, 최대 340)"
        default: "330"
  schedule:
    # 평일 퇴근 시간대(KST 16:00~22:00) 장기 수집 세션.
    # GitHub cron 은 수십 분~수 시간씩 밀리거나 누락되므로 KST 14:07~21:37 에 30분 간격으로
    # 여러 번 트리거한다. 먼저 뜬 실행이 16:00 까지 기다렸다가 최대 5.5시간 수집하고,
    # 그동안 온 트리거는 대기열에서 기다렸다가 남은 시간대를 이어받는다(시간대가 지났으면 즉시 종료).
    - cron: "7,37 5-12 * * 1-5"

concurrency:
  group: ${{ github.workflow }}
  # 긴 세션을 새 트리거가 끊지 않도록 취소하지 않고 대기시킨다 (대기열은 최신 1건만 유지)
  cancel-in-progress: false

permissions:
  contents: write
  # 수집 실패 알림 이슈 (bus-arrival-failure 라벨)
  issues: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v5
        with:
          # 긴 세션 뒤에 대기하던 run 이 run 생성 시점의 오래된 커밋을 받아 최신 로그를 덮어쓰지 않도록,
          # job 시작 시점의 브랜치 최신 커밋을 받는다.
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-bus-${{ hashFiles('bus-arrival/requirements.txt', 'security-constraints.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-bus-

      - name: Install deps
        run: python -m pip install --disable-pip-version-check -r bus-arrival/requirements.txt

      - name: Check Brotli runtime
        run: python scripts/check-brotli-runtime.py

      - name: Record runner network diagnostics
        continue-on-error: true
        timeout-minutes: 1
        run: python bus-arrival/scripts/runner_diagnostics.py --output "$RUNNER_TEMP/bus-arrival-network.json"

      # 로컬에서 되는 출처가 runner(해외 IP)에서 막힐 수 있다. 세션 시작 때 출처마다 1회 실제 조회해
      # 실행 화면 주석과 artifact 로 남긴다. 실패해도 수집은 그대로 진행한다 (막힌 출처는 교대 조회가 쉬게 한다).
      - name: Probe arrival sources from this runner
        continue-on-error: true
        timeout-minutes: 2
        run: python bus-arrival/scripts/source_probe.py --output "$RUNNER_TEMP/bus-arrival-sources.json"
        env:
          SERVICE_KEY: ${{ secrets.BUS_SERVICE_KEY }}

      - name: Collect session
        id: collect
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          code=0
          bash bus-arrival/scripts/session.sh || code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code
        env:
          SERVICE_KEY: ${{ secrets.BUS_SERVICE_KEY }}
          BUS_WINDOW: ${{ inputs.window || '16:00-22:00' }}
          BUS_SESSION_MINUTES: ${{ inputs.session_minutes || '330' }}
          # 평상시 게시 주기. 버스 임박(15분/2정거장 이내)이면 60초마다 게시한다 (BUS_URGENT_PUBLISH_SECONDS).
          BUS_PUBLISH_SECONDS: "120"
          # 조회 간격: 추적 중 30초, 버스 없음 60초. 출처를 교대로 쓰므로 출처마다 호출은 1/4 수준이다.
          BUS_INTERVAL: "30"
          BUS_IDLE_INTERVAL: "60"
          # 도착 정보 출처 교대 조회 (섞은 순서로 매 조회 하나, 실패 시 나머지로 대체) — reports/SOURCES.md
          BUS_SOURCES: "official,gbis_web,kakao,naver"
          # Retire an unreachable runner after 8 failed polls; retain state/call budget.
          BUS_MAX_CONNECT_TIMEOUTS: "8"
          # <=15 min or <=2 stops: publish every 60s right after a poll; no extra API calls.
          BUS_URGENT_PREDICT_SEC: "900"
          # 기본 정류장 07511은 전체 노선 1회 호출로 대체. 실패 시 3100 항목 API 폴백.
          BUS_PRIMARY_MODE: "station-list"
          # 성남시청전면(06004, staOrder 12) — 매 구간 노선 API 로 다시 해석하지 않도록 고정
          BUS_SECONDARY_STATION_ID: "205000029"
          # GBIS 웹(www.gbis.go.kr) 노선 화면의 3100 전 차량 위치·07511/06004 도달 구간 기록.
          # 관측 전용: 인증키·일일 호출 한도를 쓰지 않고 알림·안전 모델에도 반영하지 않는다.
          BUS_GBIS_WEB: "1"
          # 조회 간격이 30초로 줄어도 노선 위치는 55초에 한 번만 읽는다
          BUS_GBIS_WEB_MIN_GAP: "55"


      - name: Preserve runner network diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: bus-arrival-network-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/bus-arrival-network.json
            ${{ runner.temp }}/bus-arrival-sources.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Preserve collection on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: bus-arrival-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            bus-arrival/*_log.csv
            bus-arrival/tracker_state.json
            bus-arrival/status.json
            bus-arrival/summary.json
          retention-days: 14

      # 2026-11-04~09 게시 실패가 6일간 알려지지 않았다. 실패하면 열린 알림 이슈 하나에 모아 남긴다.
      # 종료 코드 75(연결 시간 초과로 runner 교체)는 다음 트리거가 이어받는 정상 복구라 알리지 않는다.
      - name: Report failure as issue
        if: failure() && steps.collect.outputs.exit_code != '75'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EXIT_CODE: ${{ steps.collect.outputs.exit_code }}
        run: |
          label=bus-arrival-failure
          gh label create "$label" --color B60205 --description "bus-arrival 수집 실패 알림" 2>/dev/null || true
          body="$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST') 수집 실패 (종료 코드: ${EXIT_CODE:-수집 전 단계}) — $RUN_URL"
          issue=$(gh issue list --label "$label" --state open --limit 1 --json number --jq '.[0].number // empty')
          if [[ -n $issue ]]; then
            gh issue comment "$issue" --body "$body"
          else
            gh issue create --label "$label" --title "bus-arrival 수집 실패" \
              --body "$body"$'\n\n'"다음 실행이 실패 없이 끝나면 자동으로 닫힌다. 그 전에 또 실패하면 여기에 댓글로 쌓인다."
          fi

      - name: Close failure issue after recovery
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for issue in $(gh issue list --label bus-arrival-failure --state open --json number --jq '.[].number'); do
            gh issue close "$issue" --comment "다음 실행이 실패 없이 끝나 닫음 (수집 시간대 밖이면 수집 없이 끝났을 수 있음) — $RUN_URL"
          done
