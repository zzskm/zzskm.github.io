name: bus arrival scrape

on:
  workflow_dispatch:
  schedule:
    # UTC 22:00-23:59 → KST 다음날 07:00-08:59 (출근)
    # UTC 00:00-11:59 → KST 당일 09:00-20:59 (출근~퇴근)
    - cron: "*/5 22-23,0-11 * * *"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-bus-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-bus-

      - name: Install deps
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: KST weekday + holiday gate
        id: gate
        run: python bus-arrival/scripts/scrape.py --gate-only

      - name: Run scraper
        if: steps.gate.outputs.skip != 'true'
        run: |
          python bus-arrival/scripts/scrape.py \
            --route-id 204000170 \
            --sta-order 6 \
            --sta-order-pangyo 7 \
            --interval 60 \
            --max-polls 70 \
            --output-csv bus-arrival/arrival_log.csv \
            --status-json bus-arrival/status.json \
            --log-level INFO
        env:
          SERVICE_KEY: ${{ secrets.BUS_SERVICE_KEY }}

      - name: Commit logs
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add bus-arrival/
          git diff --cached --quiet || git commit -m "bus: $(date -u +%Y-%m-%dT%H:%M)Z"
          git push
