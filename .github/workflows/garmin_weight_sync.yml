name: garmin weight sync

on:
  workflow_dispatch:
    inputs:
      backfill_days:
        description: Days to resync, ending today
        required: false
        default: "3"
  # 정각은 GitHub 예약 실행이 가장 밀리는 시각이라 분을 비킨다. 00:41, 09:41 KST.
  schedule:
    - cron: "41 15 * * *"
    - cron: "41 0 * * *"

concurrency:
  group: ${{ github.workflow }}
  # 실행 중인 수집을 끊지 않는다. 뒤 실행은 앞 실행이 끝날 때까지 기다린다.
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # 전체 이력은 필요 없다. 푸시가 밀리면 최신 main을 얕게 받아 데이터 파일만 다시 얹는다.
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'security-constraints.txt') }}-garmin-weight
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Brotli runtime
        run: python scripts/check-brotli-runtime.py --require-curl

      - name: Ensure directories
        run: mkdir -p garmin-weight/data garmin-weight/scripts

      - name: Check auth secrets
        run: |
          if [[ -z "${GARMIN_TOKENS}" && ( -z "${GARMIN_EMAIL}" || -z "${GARMIN_PASSWORD}" ) ]]; then
            echo "::error::No Garmin auth configured. Set GARMIN_TOKENS secret (preferred) or both GARMIN_EMAIL + GARMIN_PASSWORD."
            exit 1
          fi
        env:
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}

      - name: Sync Garmin aggregates
        run: |
          python garmin-weight/scripts/sync_garmin.py --backfill-days "${BACKFILL_DAYS}" --date "$(TZ=Asia/Seoul date +%Y-%m-%d)"
        env:
          BACKFILL_DAYS: ${{ github.event.inputs.backfill_days || '3' }}
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
          GARMIN_TOKENS_JSON: ${{ secrets.GARMIN_TOKENS_JSON }}
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: garmin-weight-data
          path: |
            garmin-weight/data/daily_metrics.csv
            garmin-weight/data/summary.json
          if-no-files-found: warn
          # 같은 내용이 커밋되므로 오래 둘 필요가 없다. 실패한 실행의 결과를 볼 때만 쓴다.
          retention-days: 7

      # 수집이 전부 실패하면 sync 스크립트가 1로 끝나 이 스텝은 건너뛴다(직전 데이터 유지, 실패 알림).
      # 데이터 파일은 이 워크플로만 쓴다. 푸시가 밀리면 최신 main 위에 같은 두 파일을 다시 얹어 커밋한다.
      - name: Commit and push data
        if: success() && github.ref == 'refs/heads/main'
        env:
          DATA_FILES: "garmin-weight/data/daily_metrics.csv garmin-weight/data/summary.json"
          MAX_ATTEMPTS: "5"
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          stash="$RUNNER_TEMP/garmin-data"
          mkdir -p "$stash"
          for f in $DATA_FILES; do cp "$f" "$stash/"; done

          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            git add $DATA_FILES
            if git diff --staged --quiet; then
              echo "No data changes to commit."
              exit 0
            fi
            git commit -q -m "chore: update garmin weight data"
            if git push origin HEAD:main; then
              echo "Push succeeded on attempt $attempt."
              exit 0
            fi
            echo "Push failed on attempt $attempt; re-applying data files on the latest main."
            sleep $((attempt * 2))
            git fetch -q --depth=1 origin main
            git reset -q --hard FETCH_HEAD
            for f in $DATA_FILES; do cp "$stash/$(basename "$f")" "$f"; done
          done

          echo "::error::Push still failing after $MAX_ATTEMPTS attempts"
          exit 1
