name: garmin weight sync

on:
  workflow_dispatch:
    inputs:
      backfill_days:
        description: Days to resync (1-60), ending on end_date. 4 or more never empties, zeroes or lowers an existing cell.
        required: false
        default: "3"
      end_date:
        description: Last day to resync (YYYY-MM-DD, KST, not in the future). Empty means today. Use it to backfill in 30-day steps.
        required: false
        default: ""
  # 정각은 GitHub 예약 실행이 가장 밀리는 시각이라 분을 비킨다. 00:41, 09:41 KST.
  schedule:
    - cron: "41 15 * * *"
    - cron: "41 0 * * *"

concurrency:
  group: ${{ github.workflow }}
  # 실행 중인 수집을 끊지 않는다. 뒤 실행은 앞 실행이 끝날 때까지 기다린다.
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # 전체 이력은 필요 없다. 푸시가 밀리면 최신 main을 얕게 받아 데이터 파일만 다시 얹는다.
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'security-constraints.txt') }}-garmin-weight
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Brotli runtime
        run: python scripts/check-brotli-runtime.py --require-curl

      - name: Ensure directories
        run: mkdir -p garmin-weight/data garmin-weight/scripts

      # 비밀번호 로그인은 토큰 캐시가 없거나 거부될 때의 대체 경로라서 항상 필요하다.
      # GARMIN_TOKENS 시크릿은 토큰 캐시 암호화 키다. Garmin 토큰이 아니며 Python에는 넘기지 않는다.
      - name: Check auth secrets
        run: |
          if [[ -z "${GARMIN_EMAIL}" || -z "${GARMIN_PASSWORD}" ]]; then
            echo "::error::Set both GARMIN_EMAIL and GARMIN_PASSWORD secrets (password login is the fallback for the token cache)."
            exit 1
          fi
          if [[ -z "${GARMIN_TOKEN_KEY}" ]]; then
            echo "::warning::GARMIN_TOKENS secret (token cache key) is empty; logging in with password only."
          fi
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GARMIN_TOKEN_KEY: ${{ secrets.GARMIN_TOKENS }}

      # 토큰 캐시(S1): garminconnect 토큰 파일을 GARMIN_TOKENS 값으로 암호화해 Actions 캐시에 둔다.
      # 캐시는 바꿀 수 없으므로 실행마다 새 키로 저장하고, 복원은 접두사로 가장 최근 것을 받는다.
      # 경로 문자열이 캐시 버전에 들어가므로 복원과 저장은 같은 경로를 써야 한다.
      # 복원도 저장처럼 main에서만 한다. 다른 브랜치의 수동 실행이 main의 토큰으로 로그인하면 토큰이 갱신될 수 있는데,
      # 그 실행은 저장하지 않으므로 main의 캐시에 남은 리프레시 토큰이 무효가 된다. 다른 브랜치는 비밀번호로 로그인한다.
      - name: Restore token cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/garmin-token-cache
          key: garmin-tokens-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: garmin-tokens-v1-

      # 복호화에 실패하면 파일 없이 계속한다(비밀번호 로그인 후 새 토큰을 저장한다).
      - name: Decrypt token cache
        env:
          GARMIN_TOKEN_KEY: ${{ secrets.GARMIN_TOKENS }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "${GARMIN_TOKEN_KEY}" ]]; then
            echo "No cache key; token cache disabled."
            exit 0
          fi
          dir="$RUNNER_TEMP/garmin-tokens"
          enc="$RUNNER_TEMP/garmin-token-cache/garmin_tokens.json.enc"
          mkdir -p "$dir"
          echo "GARMIN_TOKEN_DIR=$dir" >> "$GITHUB_ENV"
          if [[ ! -f "$enc" ]]; then
            echo "No token cache yet."
            exit 0
          fi
          if openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 -pass env:GARMIN_TOKEN_KEY -in "$enc" -out "$dir/garmin_tokens.json" 2>/dev/null; then
            sha256sum "$dir/garmin_tokens.json" | cut -d' ' -f1 > "$RUNNER_TEMP/garmin-tokens.sha"
            echo "Token cache restored."
          else
            rm -f "$dir/garmin_tokens.json"
            echo "::warning::garmin token cache could not be decrypted; using password"
          fi

      # 입력 검증은 sync_garmin.py가 한다: 날 수 1~60, 실제로 있는 날짜, 미래 날짜 거절, CSV 첫 날짜 앞은 자름.
      # 4일 이상이면 보호 병합으로 돈다(값이 있던 칸을 비우거나 0으로 만들지 않는다). 그것도 스크립트가 정한다.
      # 여기서는 형태만 본다. 셸 산술은 08·099 같은 값을 8진수로 읽다 실패해 검사가 통째로 빠지므로 쓰지 않는다.
      - name: Sync Garmin aggregates
        id: sync
        run: |
          set -euo pipefail
          if ! [[ "${BACKFILL_DAYS}" =~ ^[1-9][0-9]?$ ]]; then
            echo "::error::backfill_days must be a whole number from 1 to 60 without leading zeros"
            exit 1
          fi
          args=(--backfill-days "${BACKFILL_DAYS}")
          if [[ -n "${END_DATE}" ]]; then
            if ! [[ "${END_DATE}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "::error::end_date must be YYYY-MM-DD"
              exit 1
            fi
            args+=(--date "${END_DATE}")
          fi
          python garmin-weight/scripts/sync_garmin.py "${args[@]}"
        env:
          BACKFILL_DAYS: ${{ github.event.inputs.backfill_days || '3' }}
          END_DATE: ${{ github.event.inputs.end_date || '' }}
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}

      # 수집이 실패해도 로그인 중에 토큰이 갱신됐을 수 있으므로 always()다. 바뀐 토큰만, main에서만 저장한다.
      - name: Encrypt tokens for the cache
        id: token-encrypt
        if: always() && github.ref == 'refs/heads/main' && env.GARMIN_TOKEN_DIR != ''
        env:
          GARMIN_TOKEN_KEY: ${{ secrets.GARMIN_TOKENS }}
        run: |
          set -euo pipefail
          umask 077
          token="$GARMIN_TOKEN_DIR/garmin_tokens.json"
          if [[ ! -f "$token" ]] || ! jq -e '.di_token and .di_refresh_token' "$token" >/dev/null 2>&1; then
            echo "No usable tokens to save."
            exit 0
          fi
          if [[ "$(cat "$RUNNER_TEMP/garmin-tokens.sha" 2>/dev/null || true)" == "$(sha256sum "$token" | cut -d' ' -f1)" ]]; then
            echo "Tokens unchanged."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/garmin-token-cache"
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -md sha256 -pass env:GARMIN_TOKEN_KEY -in "$token" -out "$RUNNER_TEMP/garmin-token-cache/garmin_tokens.json.enc"
          echo "save=true" >> "$GITHUB_OUTPUT"

      - name: Save token cache
        if: always() && steps.token-encrypt.outputs.save == 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/garmin-token-cache
          key: garmin-tokens-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Remove plaintext tokens
        if: always()
        run: rm -rf "$RUNNER_TEMP/garmin-tokens" "$RUNNER_TEMP/garmin-tokens.sha"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: garmin-weight-data
          path: |
            garmin-weight/data/daily_metrics.csv
            garmin-weight/data/summary.json
          if-no-files-found: warn
          # 같은 내용이 커밋되므로 오래 둘 필요가 없다. 실패한 실행의 결과를 볼 때만 쓴다.
          retention-days: 7

      # 수집이 실패하면(전부 실패, 중간에 멈춤, Garmin 응답 없음) sync 스크립트가 1로 끝나 이 스텝은 건너뛴다
      # (직전 데이터 유지, 실패 알림). 조건은 수집 스텝의 결과만 본다. 수집은 성공했는데 그 뒤의 뒷정리
      # (토큰 암호화, 캐시 저장, 아티팩트 업로드)가 실패했다고 받은 데이터를 버리지 않는다.
      # 데이터 파일은 이 워크플로만 쓴다. 푸시가 밀리면 최신 main 위에 같은 두 파일을 다시 얹어 커밋한다.
      - name: Commit and push data
        if: ${{ !cancelled() && steps.sync.outcome == 'success' && github.ref == 'refs/heads/main' }}
        env:
          DATA_FILES: "garmin-weight/data/daily_metrics.csv garmin-weight/data/summary.json"
          MAX_ATTEMPTS: "5"
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          stash="$RUNNER_TEMP/garmin-data"
          mkdir -p "$stash"
          for f in $DATA_FILES; do cp "$f" "$stash/"; done

          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            git add $DATA_FILES
            if git diff --staged --quiet; then
              echo "No data changes to commit."
              exit 0
            fi
            git commit -q -m "chore: update garmin weight data"
            if git push origin HEAD:main; then
              echo "Push succeeded on attempt $attempt."
              exit 0
            fi
            echo "Push failed on attempt $attempt; re-applying data files on the latest main."
            sleep $((attempt * 2))
            git fetch -q --depth=1 origin main
            git reset -q --hard FETCH_HEAD
            for f in $DATA_FILES; do cp "$stash/$(basename "$f")" "$f"; done
          done

          echo "::error::Push still failing after $MAX_ATTEMPTS attempts"
          exit 1
