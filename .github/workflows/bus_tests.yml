name: bus regression tests
on:
  pull_request:
    paths:
      - 'bus-arrival/**'
      - 'tests/*bus*'
      - '.github/workflows/bus_*.yml'
  push:
    branches: [main]
    paths:
      - 'bus-arrival/alarm.js'
      - 'bus-arrival/dashboard.js'
      - 'bus-arrival/index.html'
      - 'bus-arrival/scripts/**'
      - 'tests/*bus*'
      - '.github/workflows/bus_*.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: |
          python -m pip install -r bus-arrival/requirements.txt pytest playwright
          python -m playwright install --with-deps chromium
      - name: Unit, replay and browser regressions
        env:
          BUS_REQUIRE_BROWSER_TESTS: '1'
        run: |
          python -m pytest tests/test_bus*.py
          bash -n bus-arrival/scripts/session.sh
      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bus-ui-screenshots
          path: /tmp/bus-ui-*.png
          if-no-files-found: ignore
