name: bus regression tests
on:
  pull_request:
    paths:
      - 'bus-arrival/**'
      - 'tests/*bus*'
      - 'dashboard*'
      - 'tests/*dashboard*'
      - '.github/workflows/bus_*.yml'
      - '.node-version'
      - 'security-constraints.txt'
      - 'scripts/check-*-runtime.*'
  push:
    branches: [main]
    paths:
      - 'bus-arrival/alarm.js'
      - 'bus-arrival/dashboard.js'
      - 'bus-arrival/app.js'
      - 'bus-arrival/index.html'
      - 'bus-arrival/scripts/**'
      - 'tests/*bus*'
      - 'dashboard*'
      - 'tests/*dashboard*'
      - '.github/workflows/bus_*.yml'
      - '.node-version'
      - 'security-constraints.txt'
      - 'scripts/check-*-runtime.*'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
          check-latest: true
      - name: Check Node runtime
        run: node scripts/check-node-runtime.mjs
      - name: Install test dependencies
        run: |
          python -m pip install -r bus-arrival/requirements.txt pytest playwright
          python -m playwright install --with-deps chromium
      - name: Check Brotli runtime
        run: python scripts/check-brotli-runtime.py
      - name: Unit, replay and browser regressions
        env:
          BUS_REQUIRE_BROWSER_TESTS: '1'
          DASHBOARD_SCREENSHOT_DIR: '/tmp/dashboard-preview'
        run: |
          python -m pytest tests/test_bus*.py tests/test_dashboard_browser.py
          node --test tests/dashboard.test.mjs
          bash -n bus-arrival/scripts/session.sh
      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: bus-ui-screenshots
          path: |
            /tmp/bus-ui-*.png
            /tmp/dashboard-preview/*.png
          if-no-files-found: ignore
