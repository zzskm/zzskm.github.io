<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>3100 퇴근 버스</title>
  <style>
    :root { --ink:#17212b; --muted:#718096; --line:#e6ebf0; --blue:#1769aa; --green:#137333; --amber:#9a6700; }
    * { box-sizing:border-box; }
    body { margin:0; padding:20px 14px 48px; background:#f4f7fa; color:var(--ink); font-family:system-ui,sans-serif; }
    main { max-width:920px; margin:auto; }
    header { margin:10px 0 18px; }
    h1 { margin:0 0 6px; font-size:clamp(24px,5vw,36px); letter-spacing:-.04em; }
    h2 { margin:30px 0 10px; font-size:17px; }
    .muted { color:var(--muted); font-size:13px; }
    .hero { background:linear-gradient(135deg,#124e78,#1982a8); color:white; border-radius:20px; padding:22px; box-shadow:0 12px 30px #124e7830; }
    .hero-label { opacity:.8; font-size:13px; }
    .eta { margin:7px 0; font-size:clamp(40px,11vw,76px); font-weight:750; letter-spacing:-.07em; line-height:1; }
    .hero-detail { display:flex; gap:14px; flex-wrap:wrap; font-size:13px; opacity:.9; }
    .status-line { margin-top:12px; font-size:12px; opacity:.75; }
    .cards { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; margin-top:12px; }
    .card { min-height:78px; padding:12px; background:white; border:1px solid var(--line); border-radius:12px; }
    .card-label { color:var(--muted); font-size:12px; }
    .card-value { margin-top:5px; font-size:21px; font-weight:700; }
    .confidence-high { color:var(--green); } .confidence-medium { color:var(--amber); } .confidence-low,.stale { color:#b42318; }
    .panel { padding:15px; background:white; border:1px solid var(--line); border-radius:14px; }
    .chart { display:flex; align-items:end; gap:4px; height:120px; overflow:hidden; padding-top:14px; }
    .bar { min-width:7px; flex:1; max-width:18px; background:#62a8cf; border-radius:4px 4px 0 0; position:relative; }
    .bar:hover { background:#1769aa; }
    .table-wrap { overflow-x:auto; background:white; border:1px solid var(--line); border-radius:14px; }
    table { border-collapse:collapse; width:100%; min-width:540px; font-size:12px; }
    th,td { padding:9px 10px; border-bottom:1px solid var(--line); text-align:left; white-space:nowrap; }
    th { color:var(--muted); background:#f8fafc; font-weight:600; }
    tr:last-child td { border-bottom:0; }
    .empty { padding:18px; color:var(--muted); text-align:center; }
    .tag { display:inline-block; padding:3px 7px; border-radius:999px; background:#edf4f8; color:#31556b; }
    .error { color:#b42318; }
    @media (max-width:650px) { .cards { grid-template-columns:repeat(2,minmax(0,1fr)); } body { padding-top:12px; } .hero { border-radius:16px; } }
  </style>
</head>
<body>
<main>
  <header>
    <h1>3100 퇴근 버스</h1>
    <div class="muted">유라코퍼레이션.SK케미칼(07511) · 우림아파트 방면</div>
  </header>

  <section class="hero" aria-live="polite">
    <div class="hero-label">3100번 우림아파트 방면 · 유라코퍼레이션.SK케미칼</div>
    <div id="eta" class="eta">--</div>
    <div id="hero-detail" class="hero-detail">유라코퍼레이션 도착 정보를 불러오는 중입니다.</div>
    <div id="status" class="status-line">마지막 조회: -</div>
  </section>

  <section class="cards" id="cards" aria-label="현재 버스 상태"></section>

  <h2>최근 예측 흐름</h2>
  <section class="panel">
    <div id="chart" class="chart" aria-label="최근 도착 예측 막대 그래프"></div>
    <div class="muted">막대가 낮을수록 도착이 가까운 상태입니다.</div>
  </section>

  <h2>최근 도착 추정 기록</h2>
  <div class="table-wrap">
    <table id="arrivals">
      <thead><tr><th>시각</th><th>차량</th><th>최소 예측</th><th>표본</th><th>판정</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <h2>수집 상태</h2>
  <div id="system" class="panel muted">확인 중...</div>
</main>
<script>
  const $ = (s) => document.querySelector(s);
  const escapeHtml = (value) => String(value ?? "-").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
  const formatEta = (seconds) => {
    const n = Number(seconds);
    if (!Number.isFinite(n) || n < 0) return "도착 정보 없음";
    if (n < 60) return "곧 도착 예정";
    return `${Math.max(1, Math.round(n / 60))}분 후 도착 예정`;
  };
  const confidenceLabel = (value) => ({high:"높음", medium:"보통", low:"낮음", unknown:"알 수 없음"}[value] || "알 수 없음");
  const csvRows = (text) => {
    const lines = text.trim().split(/\r?\n/).filter(Boolean);
    if (lines.length < 2) return [];
    const headers = lines[0].split(",");
    return lines.slice(1).map(line => {
      const values = line.split(",");
      return Object.fromEntries(headers.map((h, i) => [h, values[i] ?? ""]));
    });
  };

  async function load() {
    const qs = "?t=" + Date.now();
    const [status, summary, predictionsText, arrivalsText] = await Promise.all([
      fetch("status.json" + qs).then(r => r.ok ? r.json() : null).catch(() => null),
      fetch("summary.json" + qs).then(r => r.ok ? r.json() : null).catch(() => null),
      fetch("predict_log.csv" + qs).then(r => r.ok ? r.text() : "").catch(() => ""),
      fetch("arrival_log.csv" + qs).then(r => r.ok ? r.text() : "").catch(() => "")
    ]);
    const predictions = csvRows(predictionsText).slice(-30);
    const arrivals = csvRows(arrivalsText).slice(-30).reverse();
    const currentSeconds = status?.predict_sec;
    $("#eta").textContent = formatEta(currentSeconds);
    $("#hero-detail").innerHTML = status
      ? `<span>차량 ${escapeHtml(status.current_plate || status.current_veh_id || "-")}</span><span>빈자리 ${status.remain_seat != null && status.remain_seat >= 0 ? escapeHtml(status.remain_seat) + "석" : "정보 없음"}</span><span>신뢰도 ${confidenceLabel(status.confidence)}</span>`
      : "현재 상태를 확인할 수 없습니다.";
    $("#status").textContent = "마지막 조회: " + (status?.last_poll_local || status?.last_poll || "-");

    const cards = [
      ["현재 예측", formatEta(currentSeconds)],
      ["신뢰도", confidenceLabel(status?.confidence)],
      ["오늘 표본", summary?.today?.samples || 0],
      ["도착 기록", summary?.arrival_records || 0]
    ];
    $("#cards").innerHTML = cards.map(([label, value]) => `<div class="card"><div class="card-label">${label}</div><div class="card-value">${escapeHtml(value)}</div></div>`).join("");

    const values = predictions.map(r => Number(r.predict_sec)).filter(Number.isFinite);
    const max = Math.max(...values, 60);
    $("#chart").innerHTML = values.length ? values.map((value, i) => `<div class="bar" title="${escapeHtml(value)}초" style="height:${Math.max(8, 100 - value / max * 88)}%"></div>`).join("") : '<div class="empty">예측 데이터가 없습니다.</div>';
    $("#arrivals tbody").innerHTML = arrivals.length ? arrivals.map(r => `<tr><td>${escapeHtml((r.ts_kst || "").slice(0, 16).replace("T", " "))}</td><td>${escapeHtml(r.plateNo || r.vehId)}</td><td>${escapeHtml(r.min_predict_sec ? r.min_predict_sec + "초" : "-")}</td><td>${escapeHtml(r.samples)}</td><td><span class="tag">${escapeHtml(r.departure_reason || "미분류")}</span></td></tr>`).join("") : '<tr><td colspan="5" class="empty">아직 기록이 없습니다.</td></tr>';
    $("#system").innerHTML = status?.error ? `<span class="error">조회 상태: ${escapeHtml(status.error)}</span> · 연속 오류 ${escapeHtml(status.consec_fail || 0)}회` : `정상 수집 중 · 호출 ${escapeHtml(status?.daily_calls || 0)}회 · 2차 정류장 ID ${escapeHtml(status?.secondary_station_id || "해석 대기")}`;
  }
  load().catch(e => { $("#status").textContent = "화면 데이터 로드 실패: " + e.message; });
  setInterval(() => load().catch(() => {}), 60000);
</script>
</body>
</html>
